<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Gokstad Kystlag</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Custom preview styles matching the website
    const previewStyles = `
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

      body {
        font-family: 'Roboto', sans-serif;
        background: #f5f0e8;
        color: #1a1a2e;
        margin: 0;
        padding: 24px;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Roboto Slab', serif;
        color: #1a1a2e;
      }
      .preview-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        max-width: 700px;
        margin: 0 auto;
        overflow: hidden;
      }
      .preview-image {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
      }
      .preview-content {
        padding: 32px;
      }
      .preview-meta {
        display: flex;
        gap: 16px;
        color: #6EC1E4;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .preview-title {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 12px 0;
        line-height: 1.3;
      }
      .preview-beskrivelse {
        color: #54595f;
        font-size: 16px;
        margin-bottom: 24px;
        line-height: 1.6;
      }
      .preview-body {
        line-height: 1.8;
        font-size: 16px;
      }
      .preview-body p { margin-bottom: 16px; }
      .preview-body img {
        max-width: 100%;
        border-radius: 8px;
        margin: 16px 0;
      }
      .preview-body a {
        color: #2c5f7c;
        text-decoration: underline;
      }
      .preview-body h2 { font-size: 22px; margin: 24px 0 12px; }
      .preview-body h3 { font-size: 18px; margin: 20px 0 10px; }
      .preview-body ul, .preview-body ol { padding-left: 24px; margin-bottom: 16px; }
      .preview-body blockquote {
        border-left: 4px solid #d4a843;
        padding-left: 16px;
        color: #54595f;
        margin: 16px 0;
      }
      .preview-badge {
        display: inline-block;
        background: #2c5f7c;
        color: white;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 4px;
        margin-bottom: 12px;
      }
      .preview-location {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #54595f;
        font-size: 14px;
        margin-top: 4px;
      }
    `;

    // Artikkel preview
    const ArtikkelPreview = createClass({
      render: function () {
        const entry = this.props.entry;
        const title = entry.getIn(['data', 'tittel']) || 'Uten tittel';
        const beskrivelse = entry.getIn(['data', 'beskrivelse']) || '';
        const dato = entry.getIn(['data', 'dato']);
        const forfatter = entry.getIn(['data', 'forfatter']);
        const bilde = entry.getIn(['data', 'bilde']);

        const datoStr = dato
          ? new Date(dato).toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' })
          : '';

        return h('div', { className: 'preview-card' },
          bilde ? h('img', { className: 'preview-image', src: this.props.getAsset(bilde).toString() }) : null,
          h('div', { className: 'preview-content' },
            h('span', { className: 'preview-badge' }, 'Artikkel'),
            h('div', { className: 'preview-meta' },
              datoStr ? h('span', {}, datoStr) : null,
              forfatter ? h('span', {}, 'Av ' + forfatter) : null
            ),
            h('h1', { className: 'preview-title' }, title),
            beskrivelse ? h('p', { className: 'preview-beskrivelse' }, beskrivelse) : null,
            h('div', { className: 'preview-body' }, this.props.widgetFor('body'))
          )
        );
      }
    });

    // Arrangement preview
    const ArrangementPreview = createClass({
      render: function () {
        const entry = this.props.entry;
        const title = entry.getIn(['data', 'tittel']) || 'Uten tittel';
        const beskrivelse = entry.getIn(['data', 'beskrivelse']) || '';
        const dato = entry.getIn(['data', 'dato']);
        const tid = entry.getIn(['data', 'tid']);
        const sted = entry.getIn(['data', 'sted']);
        const bilde = entry.getIn(['data', 'bilde']);

        const datoStr = dato
          ? new Date(dato).toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' })
          : '';

        return h('div', { className: 'preview-card' },
          bilde ? h('img', { className: 'preview-image', src: this.props.getAsset(bilde).toString() }) : null,
          h('div', { className: 'preview-content' },
            h('span', { className: 'preview-badge' }, 'Arrangement'),
            h('div', { className: 'preview-meta' },
              datoStr ? h('span', {}, datoStr) : null,
              tid ? h('span', {}, tid) : null
            ),
            h('h1', { className: 'preview-title' }, title),
            sted ? h('div', { className: 'preview-location' }, '\u{1F4CD} ' + sted) : null,
            beskrivelse ? h('p', { className: 'preview-beskrivelse' }, beskrivelse) : null,
            h('div', { className: 'preview-body' }, this.props.widgetFor('body'))
          )
        );
      }
    });

    // Register previews
    CMS.registerPreviewStyle(previewStyles, { raw: true });
    CMS.registerPreviewTemplate('artikler', ArtikkelPreview);
    CMS.registerPreviewTemplate('arrangementer', ArrangementPreview);
  </script>
</body>
</html>
