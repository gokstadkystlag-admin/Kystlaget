<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Gokstad Kystlag</title>
  <link rel="cms-config-url" href="/admin/config.yml" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Custom preview styles matching the website
    const previewStyles = `
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

      body {
        font-family: 'Roboto', sans-serif;
        background: #f5f0e8;
        color: #1a1a2e;
        margin: 0;
        padding: 24px;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Roboto Slab', serif;
        color: #1a1a2e;
      }
      .preview-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        max-width: 700px;
        margin: 0 auto;
        overflow: hidden;
      }
      .preview-image {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
      }
      .preview-content {
        padding: 32px;
      }
      .preview-meta {
        display: flex;
        gap: 16px;
        color: #6EC1E4;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .preview-title {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 12px 0;
        line-height: 1.3;
      }
      .preview-beskrivelse {
        color: #54595f;
        font-size: 16px;
        margin-bottom: 24px;
        line-height: 1.6;
      }
      .preview-body {
        line-height: 1.8;
        font-size: 16px;
      }
      .preview-body p { margin-bottom: 16px; }
      .preview-body img {
        max-width: 100%;
        border-radius: 8px;
        margin: 16px 0;
      }
      .preview-body a {
        color: #2c5f7c;
        text-decoration: underline;
      }
      .preview-body h2 { font-size: 22px; margin: 24px 0 12px; }
      .preview-body h3 { font-size: 18px; margin: 20px 0 10px; }
      .preview-body ul, .preview-body ol { padding-left: 24px; margin-bottom: 16px; }
      .preview-body blockquote {
        border-left: 4px solid #d4a843;
        padding-left: 16px;
        color: #54595f;
        margin: 16px 0;
      }
      .preview-badge {
        display: inline-block;
        background: #2c5f7c;
        color: white;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 4px;
        margin-bottom: 12px;
      }
      .preview-location {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #54595f;
        font-size: 14px;
        margin-top: 4px;
      }
      .preview-field {
        margin-bottom: 20px;
      }
      .preview-field-label {
        font-family: 'Roboto Slab', serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #2c5f7c;
        margin-bottom: 6px;
      }
      .preview-field-text {
        margin: 0;
        white-space: pre-wrap;
      }
      .preview-box {
        border-left: 3px solid #e4dcc9;
        padding-left: 16px;
        margin-bottom: 20px;
      }
      .preview-list {
        margin: 0;
        padding-left: 20px;
      }
      .preview-list li {
        margin-bottom: 4px;
      }
      .preview-inline-image {
        max-width: 100%;
        border-radius: 8px;
        margin-bottom: 12px;
      }
    `;

    // Artikkel preview
    const ArtikkelPreview = createClass({
      render: function () {
        const entry = this.props.entry;
        const title = entry.getIn(['data', 'tittel']) || 'Uten tittel';
        const beskrivelse = entry.getIn(['data', 'beskrivelse']) || '';
        const dato = entry.getIn(['data', 'dato']);
        const forfatter = entry.getIn(['data', 'forfatter']);
        const bilde = entry.getIn(['data', 'bilde']);

        const datoStr = dato
          ? new Date(dato).toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' })
          : '';

        return h('div', { className: 'preview-card' },
          bilde ? h('img', { className: 'preview-image', src: this.props.getAsset(bilde).toString() }) : null,
          h('div', { className: 'preview-content' },
            h('span', { className: 'preview-badge' }, 'Artikkel'),
            h('div', { className: 'preview-meta' },
              datoStr ? h('span', {}, datoStr) : null,
              forfatter ? h('span', {}, 'Av ' + forfatter) : null
            ),
            h('h1', { className: 'preview-title' }, title),
            beskrivelse ? h('p', { className: 'preview-beskrivelse' }, beskrivelse) : null,
            h('div', { className: 'preview-body' }, this.props.widgetFor('body'))
          )
        );
      }
    });

    // Arrangement preview
    const ArrangementPreview = createClass({
      render: function () {
        const entry = this.props.entry;
        const title = entry.getIn(['data', 'tittel']) || 'Uten tittel';
        const beskrivelse = entry.getIn(['data', 'beskrivelse']) || '';
        const dato = entry.getIn(['data', 'dato']);
        const starttid = entry.getIn(['data', 'starttid']);
        const sluttid = entry.getIn(['data', 'sluttid']);
        const sted = entry.getIn(['data', 'sted']);
        const bilde = entry.getIn(['data', 'bilde']);

        const datoStr = dato
          ? new Date(dato).toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' })
          : '';
        const tidStr = starttid ? (sluttid ? `kl. ${starttid}–${sluttid}` : `kl. ${starttid}`) : '';

        return h('div', { className: 'preview-card' },
          bilde ? h('img', { className: 'preview-image', src: this.props.getAsset(bilde).toString() }) : null,
          h('div', { className: 'preview-content' },
            h('span', { className: 'preview-badge' }, 'Arrangement'),
            h('div', { className: 'preview-meta' },
              datoStr ? h('span', {}, datoStr) : null,
              tidStr ? h('span', {}, tidStr) : null
            ),
            h('h1', { className: 'preview-title' }, title),
            sted ? h('div', { className: 'preview-location' }, '\u{1F4CD} ' + sted) : null,
            beskrivelse ? h('p', { className: 'preview-beskrivelse' }, beskrivelse) : null,
            h('div', { className: 'preview-body' }, this.props.widgetFor('body'))
          )
        );
      }
    });

    // Side (Faste sider) preview — generisk, siden feltene varierer sterkt fra fil til fil
    const IMAGE_EXT_RE = /\.(jpe?g|png|webp|avif|gif|svg)$/i;

    function humanizeKey(key) {
      const label = key.replace(/_/g, ' ');
      return label.charAt(0).toUpperCase() + label.slice(1);
    }

    function isImagePath(value) {
      return typeof value === 'string' && IMAGE_EXT_RE.test(value);
    }

    function renderSideValue(key, value, getAsset) {
      if (value === null || value === undefined || value === '') return null;

      if (typeof value === 'string') {
        if (isImagePath(value)) {
          return h('div', { key: key, className: 'preview-field' },
            h('img', { className: 'preview-inline-image', src: getAsset(value).toString() })
          );
        }
        return h('div', { key: key, className: 'preview-field' },
          h('div', { className: 'preview-field-label' }, humanizeKey(key)),
          h('p', { className: 'preview-field-text' }, value)
        );
      }

      if (Array.isArray(value)) {
        if (value.length === 0) return null;
        if (typeof value[0] === 'string') {
          return h('div', { key: key, className: 'preview-field' },
            h('div', { className: 'preview-field-label' }, humanizeKey(key)),
            h('ul', { className: 'preview-list' }, value.map(function (item, i) {
              return h('li', { key: i }, item);
            }))
          );
        }
        return h('div', { key: key, className: 'preview-field' },
          h('div', { className: 'preview-field-label' }, humanizeKey(key)),
          value.map(function (item, i) {
            return h('div', { key: i, className: 'preview-box' }, renderSideObject(item, getAsset));
          })
        );
      }

      if (typeof value === 'object') {
        const rendered = renderSideObject(value, getAsset);
        if (rendered.every(function (r) { return r === null; })) return null;
        return h('div', { key: key, className: 'preview-box' },
          h('div', { className: 'preview-field-label' }, humanizeKey(key)),
          rendered
        );
      }

      return null;
    }

    function renderSideObject(obj, getAsset) {
      return Object.keys(obj).map(function (k) {
        return renderSideValue(k, obj[k], getAsset);
      });
    }

    const SidePreview = createClass({
      render: function () {
        const getAsset = this.props.getAsset;
        const data = this.props.entry.get('data');
        const obj = data && data.toJS ? data.toJS() : {};

        const title = obj.tittel;
        const image = obj.bilde;
        const intro = obj.intro || obj.intro_tekst || obj.kort_beskrivelse || obj.sitat;

        const topKeys = ['tittel', 'bilde', 'intro', 'intro_tekst', 'kort_beskrivelse', 'sitat'];
        const rest = Object.keys(obj).filter(function (k) { return topKeys.indexOf(k) === -1; });

        return h('div', { className: 'preview-card' },
          image ? h('img', { className: 'preview-image', src: getAsset(image).toString() }) : null,
          h('div', { className: 'preview-content' },
            h('span', { className: 'preview-badge' }, 'Side'),
            title ? h('h1', { className: 'preview-title' }, title) : null,
            intro ? h('p', { className: 'preview-beskrivelse' }, intro) : null,
            h('div', { className: 'preview-body' }, rest.map(function (k) {
              return renderSideValue(k, obj[k], getAsset);
            }))
          )
        );
      }
    });

    // Register previews
    CMS.registerPreviewStyle(previewStyles, { raw: true });
    CMS.registerPreviewTemplate('artikler', ArtikkelPreview);
    CMS.registerPreviewTemplate('arrangementer', ArrangementPreview);
    CMS.registerPreviewTemplate('sider', SidePreview);
  </script>
</body>
</html>
