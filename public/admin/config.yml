          - { label: "Tekst — skjema", name: "intro_tekst", widget: "text" }
          - { label: "Overskrift — bekreftelse", name: "bekreftelse_tittel", widget: "string" }
          - { label: "Tekst — bekreftelse", name: "bekreftelse_tekst", widget: "text" }
          - label: "Kontaktinformasjon"
