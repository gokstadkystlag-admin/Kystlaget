backend:
  name: github
  repo: KVAL352/Kystlaget
  branch: master
  base_url: https://gokstad-kystlag.vercel.app
  auth_endpoint: /api/auth

locale: "nb_NO"

media_folder: "public/images"
public_folder: "/images"

logo_url: /images/logo.webp
site_url: https://gokstad-kystlag.vercel.app

collections:
  - name: "sider"
    label: "Faste sider"
    label_singular: "Side"
    description: "Tekst og bilder på de faste sidene på nettsiden. Her kan du endre innhold, men ikke sidenes oppbygning eller design."
    files:
      - name: "forside"
        label: "Forside"
        file: "src/content/sider/forside.json"
        preview_path: ""
        fields:
          - label: "Toppbilde"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Overtekst", name: "kicker", widget: "string" }
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Undertekst", name: "undertekst", widget: "string" }
              - { label: "Bilde", name: "bilde", widget: "image", media_library: { config: { max_file_size: 512000 } } }
              - { label: "Tekst på knapp 1 (Bli medlem)", name: "knapp1_tekst", widget: "string" }
              - { label: "Tekst på knapp 2 (Se arrangementer)", name: "knapp2_tekst", widget: "string" }

          - label: "Kort 1"
            name: "kort1"
            widget: "object"
            fields:
              - { label: "Bilde", name: "bilde", widget: "image", media_library: { config: { max_file_size: 512000 } } }
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }

          - label: "Kort 2"
            name: "kort2"
            widget: "object"
            fields:
              - { label: "Bilde", name: "bilde", widget: "image", media_library: { config: { max_file_size: 512000 } } }
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }

          - label: "Kort 3"
            name: "kort3"
            widget: "object"
            fields:
              - { label: "Bilde", name: "bilde", widget: "image", media_library: { config: { max_file_size: 512000 } } }
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }

          - label: "Arrangementer-seksjon (overskrift)"
            name: "arrangementer_seksjon"
            widget: "object"
            fields:
              - { label: "Overtekst", name: "kicker", widget: "string" }
              - { label: "Tittel", name: "tittel", widget: "string" }

          - label: "Aktuelt-seksjon (overskrift)"
            name: "aktuelt_seksjon"
            widget: "object"
            fields:
              - { label: "Overtekst", name: "kicker", widget: "string" }
              - { label: "Tittel", name: "tittel", widget: "string" }

          - label: "Om oss-seksjon"
            name: "om_oss"
            widget: "object"
            fields:
              - { label: "Overtekst", name: "kicker", widget: "string" }
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text", hint: "Bruk en blank linje mellom avsnitt." }
              - { label: "Tekst på knapp", name: "knapp_tekst", widget: "string" }
              - { label: "Bilde", name: "bilde", widget: "image", media_library: { config: { max_file_size: 512000 } } }

          - label: "Utleie-seksjon"
            name: "utleie_seksjon"
            widget: "object"
            fields:
              - { label: "Overtekst", name: "kicker", widget: "string" }
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
              - { label: "Tekst på knapp", name: "knapp_tekst", widget: "string" }
              - { label: "Bilde", name: "bilde", widget: "image", media_library: { config: { max_file_size: 512000 } } }

      - name: "om"
        label: "Om oss"
        file: "src/content/sider/om.json"
        preview_path: "om"
        fields:
          - { label: "Tittel", name: "tittel", widget: "string" }
          - { label: "Toppbilde", name: "bilde", widget: "image", media_library: { config: { max_file_size: 512000 } } }
          - { label: "Innledning", name: "intro", widget: "text", hint: "Bruk en blank linje mellom avsnitt." }
          - label: "Overskrift — bygninger"
            name: "bygninger_tittel"
            widget: "string"
          - label: "Bygninger og anlegg"
            name: "bygninger"
            widget: "list"
            hint: "Ett kort per bygning. Antall kort er satt i designet — ikke legg til eller fjern rader uten å avtale med utvikler."
            fields:
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
          - label: "Medlemskap"
            name: "medlem"
            widget: "object"
            fields:
              - { label: "Bilde", name: "bilde", widget: "image", media_library: { config: { max_file_size: 512000 } } }
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
              - { label: "Overskrift — fordeler", name: "fordeler_tittel", widget: "string" }
              - { label: "Fordeler", name: "fordeler", widget: "list", field: { label: "Fordel", name: "fordel", widget: "string" } }
              - { label: "Tekst på knapp", name: "knapp_tekst", widget: "string" }
          - label: "Kontakt"
            name: "kontakt"
            widget: "object"
            fields:
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
              - { label: "E-post", name: "epost", widget: "string" }
              - { label: "Telefon", name: "telefon", widget: "string" }
              - { label: "Adresse", name: "adresse", widget: "string" }

      - name: "utleie"
        label: "Utleie"
        file: "src/content/sider/utleie.json"
        preview_path: "utleie"
        fields:
          - { label: "Tittel", name: "tittel", widget: "string" }
          - { label: "Innledning", name: "intro", widget: "text" }
          - label: "Bildegalleri"
            name: "bilder"
            widget: "object"
            hint: "Fem bilder i galleriet. Antallet er satt i designet."
            fields:
              - { label: "Bilde 1", name: "bilde1", widget: "image", media_library: { config: { max_file_size: 512000 } } }
              - { label: "Bilde 2", name: "bilde2", widget: "image", media_library: { config: { max_file_size: 512000 } } }
              - { label: "Bilde 3", name: "bilde3", widget: "image", media_library: { config: { max_file_size: 512000 } } }
              - { label: "Bilde 4", name: "bilde4", widget: "image", media_library: { config: { max_file_size: 512000 } } }
              - { label: "Bilde 5", name: "bilde5", widget: "image", media_library: { config: { max_file_size: 512000 } } }
          - label: "Andre etasje"
            name: "andre_etasje"
            widget: "object"
            fields:
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Undertittel", name: "undertittel", widget: "string" }
              - { label: "Liste", name: "liste", widget: "list", field: { label: "Punkt", name: "punkt", widget: "string" } }
          - label: "Første etasje"
            name: "forste_etasje"
            widget: "object"
            fields:
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Undertittel", name: "undertittel", widget: "string" }
              - { label: "Liste", name: "liste", widget: "list", field: { label: "Punkt", name: "punkt", widget: "string" } }
          - label: "Praktisk informasjon"
            name: "praktisk"
            widget: "object"
            hint: "Fire faste bokser (leietid, nøkler, renhold, regler). Bruk **tekst** for fet skrift i listepunkter."
            fields:
              - { label: "Overskrift", name: "tittel", widget: "string" }
              - label: "Leietid"
                name: "leietid"
                widget: "object"
                fields:
                  - { label: "Tittel", name: "tittel", widget: "string" }
                  - { label: "Liste", name: "liste", widget: "list", field: { label: "Punkt", name: "punkt", widget: "string" }, hint: "Bruk **tekst** for fet skrift." }
              - label: "Nøkler og parkering"
                name: "nokler"
                widget: "object"
                fields:
                  - { label: "Tittel", name: "tittel", widget: "string" }
                  - { label: "Liste", name: "liste", widget: "list", field: { label: "Punkt", name: "punkt", widget: "string" } }
              - label: "Renhold og avfall"
                name: "renhold"
                widget: "object"
                fields:
                  - { label: "Tittel", name: "tittel", widget: "string" }
                  - { label: "Liste", name: "liste", widget: "list", field: { label: "Punkt", name: "punkt", widget: "string" } }
              - label: "Regler"
                name: "regler"
                widget: "object"
                fields:
                  - { label: "Tittel", name: "tittel", widget: "string" }
                  - { label: "Liste", name: "liste", widget: "list", field: { label: "Punkt", name: "punkt", widget: "string" } }
          - label: "Booking"
            name: "booking"
            widget: "object"
            fields:
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "text" }
              - { label: "Telefon", name: "telefon", widget: "string" }
              - { label: "Telefontid", name: "telefon_tid", widget: "string" }
              - { label: "Tekst på knapp", name: "knapp_tekst", widget: "string" }

      - name: "kontakt"
        label: "Kontakt"
