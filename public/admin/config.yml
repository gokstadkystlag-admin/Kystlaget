            fields:
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Pris — medlem", name: "medlem_pris", widget: "string" }
              - { label: "Tekst — medlem", name: "medlem_tekst", widget: "string" }
              - { label: "Pris — ikke medlem", name: "ikke_medlem_pris", widget: "string" }
              - { label: "Tekst — ikke medlem", name: "ikke_medlem_tekst", widget: "string" }
              - { label: "Tekst om periode", name: "periode_tekst", widget: "string" }
          - label: "Betaling"
            name: "betaling"
            widget: "object"
            fields:
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Vipps-nummer", name: "vipps_nummer", widget: "string" }
              - { label: "Vipps-navn", name: "vipps_navn", widget: "string" }
              - label: "Meldingsformat"
                name: "melding_format"
                widget: "string"
                hint: "Vises som eksempel på Vipps-melding, f.eks. «GB <båtnavn>, <ditt kystlag>»"
          - label: "Viktig informasjon"
            name: "info"
            widget: "object"
            fields:
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Liste", name: "liste", widget: "list", field: { label: "Punkt", name: "punkt", widget: "string" } }
          - label: "Kontakt"
            name: "kontakt"
            widget: "object"
            fields:
              - { label: "Tittel", name: "tittel", widget: "string" }
              - { label: "Adresse", name: "adresse", widget: "string" }
              - { label: "Telefon", name: "telefon", widget: "string" }
              - { label: "E-post", name: "epost", widget: "string" }

