        file: "src/content/sider/gjestebrygge.json"
        preview_path: "gjestebrygge"
        fields:
          - { label: "Tittel", name: "tittel", widget: "string" }
          - { label: "Innledning", name: "intro", widget: "text" }
          - { label: "Toppbilde", name: "bilde", widget: "image", media_library: { config: { max_file_size: 512000 } } }
          - label: "Priser"
