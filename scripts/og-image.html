<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <title>OG Image — Gokstad Kystlag</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

    .og-card {
      width: 1200px;
      height: 630px;
      background: url('../public/images/kystlaget-havn.webp') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Dark overlay for text readability */
    .og-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.75) 0%, rgba(44, 95, 124, 0.65) 100%);
    }

    /* Decorative gold bar at bottom */
    .og-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: #d4a843;
    }

    .content {
      text-align: center;
      z-index: 1;
      padding: 40px;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: white;
      padding: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      font-family: 'Roboto Slab', serif;
      font-size: 64px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .divider {
      width: 80px;
      height: 4px;
      background: #d4a843;
      margin: 0 auto 20px;
      border-radius: 2px;
    }

    p {
      font-family: 'Roboto', sans-serif;
      font-size: 28px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 400;
    }

    .location {
      font-family: 'Roboto', sans-serif;
      font-size: 20px;
      color: #d4a843;
      margin-top: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="og-card">
    <div class="content">
      <div class="logo">
        <img src="../public/images/logo.webp" alt="Logo">
      </div>
      <h1>Gokstad Kystlag</h1>
      <div class="divider"></div>
      <p>Kystkultur, båtliv og fellesskap siden 1990</p>
      <div class="location">Sandefjord</div>
    </div>
  </div>
</body>
</html>
